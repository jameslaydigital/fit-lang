<!DOCTYPE html>
<meta charset="utf-8">
<title>fit-lang</title>
<style>
html, body {
    padding: 0;
    border: none;
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    background: #000;
    color: #08f;
    font-family: sans-serif;
}

h1 {
    font-weight: 300;
    text-align: center;
    text-transform: uppercase;
}

hr {
    border: none;
    border-bottom: #08f8 solid 1px;
}

</style>
<script type="module">
import { data, setAdapter, load } from "./storage.js";
import { localStorageAdapter } from "./adapters/localStorage.js";
import { cmds } from "./cmds.js";
import { setOutput } from "./io.js";
import { printf } from "./lib/stdlib.js";
import { tokenize } from "./lib/parser.js";

import "./modules/plans/main.js";
import "./modules/workouts/main.js";
import "./modules/exercises/main.js";
import "./modules/sets/main.js";
import "./modules/stack/main.js";
import "./modules/web/main.js";

setAdapter(localStorageAdapter);

const output = [];
setOutput({

    print: (...args) => console.log(...args),

    error: (...args) => console.error(...args),

    render: async (html) => {

        document.body.innerHTML = html;

        console.log("render called");
        await new Promise(r => setTimeout(r));

        // attach command listeners:
        for (const element of document.querySelectorAll("[data-command]")) {
            element.onclick = () => window.command(element);
        }
    },

    exit: () => {},

});

await load();

if (data.plans.length === 0) {
    await cmds.dispatch("web load data".split(" "));
}

const params = new URLSearchParams(window.location.search);
const cmd = params.get("cmd") || "web dashboard";
try {
    await cmds.dispatch(cmd.split(" "));
} catch (e) {
    console.error("dispatch error:", e);
}

window.command = async function(element) {
    const commands = element.dataset.command.split(";").map(w => w.trim());
    for (const command of commands) {
        const tokens = tokenize(command);
        console.log("tokens: ", tokens);
        await cmds.dispatch(tokens);
    }
}

</script>
